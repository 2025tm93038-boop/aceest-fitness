apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-shadow
  annotations:
    nginx.ingress.kubernetes.io/mirror-target: "http://aceest-shadow.default.svc.cluster.local$request_uri"
    nginx.ingress.kubernetes.io/mirror-request-body: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: shadow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-live
                port:
                  number: 80
