name: ACEest Fitness CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-lint-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8 (syntax errors / undefined names fail the build)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-line-length=120 --exit-zero --statistics

      - name: Run Pytest suite
        run: pytest -v

  docker-build-and-test:
    name: Docker Image Build & Containerized Test
    runs-on: ubuntu-latest
    needs: build-lint-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: aceest-fitness:ci
          load: true

      - name: Run Pytest suite inside the built container
        # Tests are intentionally excluded from the production image (see .dockerignore),
        # so they're mounted in at test time rather than baked into the shipped artifact.
        run: |
          docker run --rm --user root \
            -v "$(pwd)/tests:/app/tests" \
            -v "$(pwd)/pytest.ini:/app/pytest.ini" \
            --entrypoint sh aceest-fitness:ci -c \
            "pip install --no-cache-dir pytest && pytest -v"
