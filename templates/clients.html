{% extends "base.html" %}
{% block content %}
<h2>Clients</h2>
<form method="post">
  <input name="name" placeholder="Client name" required>
  <select name="program">
    {% for name in programs %}<option value="{{ name }}">{{ name }}</option>{% endfor %}
  </select>
  <button type="submit">Save Client</button>
</form>

<div class="card">
  <ul>
    {% for c in clients %}
      <li><a href="/clients/{{ c.name }}">{{ c.name }}</a> &mdash; {{ c.program }}</li>
    {% else %}
      <li>No clients yet.</li>
    {% endfor %}
  </ul>
</div>

<p><a href="/">&laquo; Back to programs</a></p>
{% endblock %}
